[package]
name = "tessel-host-client"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Client of the Tessel host daemon: one link over any byte stream, reconnection, typed sessions"

[dependencies]
tessel-host-protocol = { path = "../host-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Dropping a CommandConnector ends the command's whole process tree: a process group on Unix,
# a kill-on-close job object on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
