[package]
name = "tessel-host"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Tessel's remote host daemon: one private socket per user, reached through SSH"

[dependencies]
tessel-host-protocol = { path = "../host-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
vt100 = "0.15"
# The same parser vt100 uses: it drives a copy of the screen to read the main screen behind
# the alternate one.
vte = "0.11"

[dev-dependencies]
tessel-host-client = { path = "../host-client" }
serde = { version = "1", features = ["derive"] }
